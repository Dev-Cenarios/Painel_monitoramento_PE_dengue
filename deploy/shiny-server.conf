# ==============================================================================
# Dengue PE | deploy/shiny-server.conf
# Bloco de exemplo para publicar o painel no Shiny Server (open source), que
# roda apps Python a partir da versao 1.5.20. Nao substitui o arquivo do
# servidor: copie SO o bloco `location /dengue_pe` para dentro do `server {}`
# de /etc/shiny-server/shiny-server.conf (com sudo), ANTES do `location /`
# que ja existe, e reinicie: sudo systemctl restart shiny-server
#
# `python` aponta para o Python do ambiente virtual do projeto - e assim que o
# Shiny Server sabe que o app e Python (procura app.py na pasta).
# `app_idle_timeout 0` mantem o processo vivo: os caches em memoria (serie por
# municipio, previsoes) nao sao refeitos a cada visita.
# ==============================================================================

server {
  listen 3838;

  location /dengue_pe {
    app_dir /srv/shiny-server/dengue_pe;
    python /srv/shiny-server/dengue_pe/.venv/bin/python;
    log_dir /var/log/shiny-server;
    app_idle_timeout 0;
  }
}
